name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run pyflakes src tests
      - name: Test
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend syntax
        run: |
          for f in src/campaign/static/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs" && node --check "$RUNNER_TEMP/check.mjs" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - uses: azure/setup-kubectl@v4
      - name: Render the manifests the release applies
        run: kubectl kustomize deploy/k8s > /dev/null

  # On pull requests, make sure the image still builds. Releases build and push it.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
