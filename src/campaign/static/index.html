<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1815" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Campaign">
  <title>Campaign</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/characters" aria-label="Campaign">⚔<span class="brand-name"> Campaign</span></a>
    <nav>
      <a href="#/characters" data-nav="characters">Characters</a>
      <a href="#/campaigns" data-nav="campaigns">Campaigns</a>
      <a href="#/admin" data-nav="admin" id="admin-link" hidden>Admin</a>
    </nav>
    <form id="account" method="post" action="/auth/logout" hidden>
      <a id="account-email" href="#/account" title="Your account and connected apps"></a>
      <a id="account-icon" href="#/account" title="Account and sign out" aria-label="Account and sign out">👤</a>
      <button type="submit" class="sign-out">Sign out</button>
    </form>
  </header>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
