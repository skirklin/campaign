# One-time setup, with admin credentials:  kubectl apply -k deploy/k8s
# The campaign-secrets Secret is created separately (docs/deploy.md, step 2)
# so no credentials live in the repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - deployer.yaml
