# The database, original uploads and pre-migration backups (CAMPAIGN_HOME=/data).
# 2Gi is the whole of the tenant's storage quota.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: campaign-data
  namespace: campaign
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
