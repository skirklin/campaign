apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign
  namespace: campaign
  labels: {app: campaign}
spec:
  replicas: 1  # SQLite on a ReadWriteOnce volume: exactly one writer
  strategy:
    type: Recreate  # never two pods on the volume at once
  selector:
    matchLabels: {app: campaign}
  template:
    metadata:
      labels: {app: campaign}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: campaign
          # The release workflow pins this to the digest it built.
          image: ghcr.io/skirklin/campaign:latest
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: CAMPAIGN_AUTH, value: google}
            - {name: CAMPAIGN_PUBLIC_URL, value: "https://campaign.kirkl.in"}
            # From the Google Cloud OAuth client (docs/deploy.md, step 1).
            - {name: GOOGLE_CLIENT_ID, value: "REPLACE_ME.apps.googleusercontent.com"}
            # Credentials: the campaign-secrets Secret, created by hand (docs/deploy.md, step 2).
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: campaign-secrets, key: ANTHROPIC_API_KEY}}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: campaign-secrets, key: GOOGLE_CLIENT_SECRET}}
            - name: CAMPAIGN_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: campaign-secrets, key: CAMPAIGN_SESSION_SECRET}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            # The tenant quota counts ephemeral storage: uploads spool to /tmp.
            requests: {cpu: 50m, memory: 256Mi, ephemeral-storage: 64Mi}
            limits: {memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: campaign-data}
        - name: tmp
          emptyDir: {}
