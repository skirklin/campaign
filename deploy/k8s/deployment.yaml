apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign
  namespace: campaign
  labels: {app: campaign}
spec:
  replicas: 1
  # Zero-downtime deploys: the new pod starts beside the old one and takes
  # traffic once it's ready; then the old one shuts down gracefully. Both
  # share the SQLite database on the volume for those seconds, which is fine:
  # SQLite locks across processes, migrations are additive (see db.py), and
  # background loops take a lease so only one runs at a time. The volume is
  # ReadWriteOnce, which is per node, and this cluster has one node.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: campaign}
  template:
    metadata:
      labels: {app: campaign}
    spec:
      serviceAccountName: campaign
      # No token for the cluster's API; the only token the pod gets is the
      # anthropic-token volume's, which is good only for the Claude API.
      automountServiceAccountToken: false
      # preStop's pause lets the Service stop routing here before the server
      # gets SIGTERM; then uvicorn finishes requests in flight (20 s).
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: campaign
          # The release workflow pins this to the digest it built.
          image: ghcr.io/skirklin/campaign:latest
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: CAMPAIGN_AUTH, value: google}
            - {name: CAMPAIGN_PUBLIC_URL, value: "https://campaign.kirkl.in"}
            # Digest with Haiku while iterating (about 1/40 of Opus). The model is
            # part of every cache key, so switching back re-digests from scratch.
            - {name: CAMPAIGN_DIGEST_MODEL, value: claude-sonnet-5-5}
            # From the Google Cloud OAuth client (docs/deploy.md, step 1).
            - {name: GOOGLE_CLIENT_ID, value: "779965064363-4ce52upmf3rktf48fn8lqk96qlfnd1ff.apps.googleusercontent.com"}
            # The Claude API: workload identity federation, no API key (docs/deploy.md, step 2).
            # The SDK trades the projected token below for a short-lived Anthropic token
            # under this federation rule. None of these IDs is a secret.
            - {name: ANTHROPIC_FEDERATION_RULE_ID, value: fdrl_01N2d82qXKPpWGAy8s8HNpC3}
            - {name: ANTHROPIC_ORGANIZATION_ID, value: a839b65b-2dfd-4db0-8076-63a76a6e7b8d}
            - {name: ANTHROPIC_WORKSPACE_ID, value: wrkspc_01YQ6EUY2tXaWJvWNa2PrNof}
            - {name: ANTHROPIC_IDENTITY_TOKEN_FILE, value: /var/run/secrets/anthropic.com/token}
            # Credentials: the campaign-secrets Secret, created by hand (docs/deploy.md, step 2).
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: campaign-secrets, key: GOOGLE_CLIENT_SECRET}}
            - name: CAMPAIGN_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: campaign-secrets, key: CAMPAIGN_SESSION_SECRET}}
            # Lets a job off this volume fetch the newest nightly snapshot (/backups/latest);
            # without it, only an admin can, from the Admin page.
            - name: CAMPAIGN_BACKUP_TOKEN
              valueFrom: {secretKeyRef: {name: campaign-secrets, key: CAMPAIGN_BACKUP_TOKEN, optional: true}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: anthropic-token, mountPath: /var/run/secrets/anthropic.com, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2  # the new pod takes traffic as soon as it can
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            # The tenant quota counts ephemeral storage: uploads spool to /tmp.
            requests: {cpu: 50m, memory: 256Mi, ephemeral-storage: 64Mi}
            limits: {memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: campaign-data}
        - name: tmp
          emptyDir: {}
        # The ServiceAccount's token for the Claude API alone (its audience), good for
        # an hour; the kubelet renews it before then and the SDK rereads the file.
        - name: anthropic-token
          projected:
            sources:
              - serviceAccountToken: {audience: "https://api.anthropic.com", expirationSeconds: 3600, path: token}
