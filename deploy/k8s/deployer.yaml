# What the release workflow deploys as: it can update the campaign
# Deployment's image and watch the rollout, in this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: campaign
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: campaign
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [campaign]
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: campaign
subjects:
  - {kind: ServiceAccount, name: deployer, namespace: campaign}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
---
# A long-lived token for the deployer, stored as the KUBE_TOKEN GitHub secret.
# Rotate by deleting this Secret and re-applying.
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: campaign
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
