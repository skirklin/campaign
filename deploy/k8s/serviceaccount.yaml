# The app's identity. Its projected token (deployment.yaml) is how the app
# signs in to the Claude API: an Anthropic federation rule trusts exactly
# system:serviceaccount:campaign:campaign with audience https://api.anthropic.com
# (docs/deploy.md, step 2). It has no access to the cluster's own API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: campaign
  namespace: campaign
automountServiceAccountToken: false
